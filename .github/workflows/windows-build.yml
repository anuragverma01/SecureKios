name: SecureKiosk Windows MSIX

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    env:
      Solution_Name: SecureKiosk.sln
      App_Project: src\SecureKiosk.App\SecureKiosk.App.csproj
      PublishProfile: Properties\PublishProfiles\win10-x64.pubxml
      Configuration: Release
      Platform: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Add Windows SDK / SignTool to PATH
        shell: pwsh
        run: |
          $kitsRoots = @(
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin",
            "$env:ProgramFiles\Windows Kits\10\bin"
          )
          $found = $null
          foreach ($root in $kitsRoots) {
            if (Test-Path $root) {
              $found = Get-ChildItem -Path $root -Filter 'signtool.exe' -Recurse -File -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match '[\\/]x64[\\/]signtool\.exe$' } |
                Sort-Object FullName -Descending |
                Select-Object -First 1
              if ($found) { break }
            }
          }
          if ($found) {
            $binDir = $found.DirectoryName
            Write-Host "Found SignTool at: $($found.FullName)"
            Write-Host "Adding to GITHUB_PATH: $binDir"
            $binDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          } else {
            Write-Warning "signtool.exe not found in Windows Kits"
          }

      - name: Restore SecureKiosk.App for packaging
        shell: pwsh
        run: >-
          msbuild $env:App_Project
          /t:Restore
          /p:Configuration=$env:Configuration
          /p:Platform=$env:Platform
          /p:PublishProfile=$env:PublishProfile
          /p:RuntimeIdentifier=win-x64
          /p:SelfContained=true
          /p:WindowsAppSDKSelfContained=true

      - name: Build and package self-contained MSIX
        shell: pwsh
        run: >-
          msbuild $env:App_Project
          /t:Build
          /p:Configuration=$env:Configuration
          /p:Platform=$env:Platform
          /p:PublishProfile=$env:PublishProfile
          /p:EnableMsixTooling=true
          /p:AppxPackageDir="$env:GITHUB_WORKSPACE/artifacts/"
          /p:UapAppxPackageBuildMode=SideloadOnly
          /p:AppxBundle=Never
          /p:AppxPackageSigningEnabled=false
          /p:GenerateAppxPackageOnBuild=true
          /p:RuntimeIdentifier=win-x64
          /p:SelfContained=true
          /p:WindowsAppSDKSelfContained=true

      - name: Locate and stage unsigned MSIX
        id: locate
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null

          $packages = @(
            Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -File -Filter '*.msix' -Recurse -Force -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' }
          )
          if ($packages.Count -eq 0) {
            throw 'MSIX generation failed: no .msix file was found under the workspace.'
          }
          $sourceMsix = $packages[0].FullName
          Write-Host "Found generated MSIX: $sourceMsix"

          $finalMsix = Join-Path $artifactDir 'SecureKiosk.App_1.0.0.0_x64.msix'
          if (-not [string]::Equals($sourceMsix, $finalMsix, [StringComparison]::OrdinalIgnoreCase)) {
            Copy-Item -LiteralPath $sourceMsix -Destination $finalMsix -Force
          }

          # Clean up any nested directories inside artifacts (like test folders)
          Get-ChildItem -LiteralPath $artifactDir -Directory -ErrorAction SilentlyContinue |
            Remove-Item -Recurse -Force

          Write-Host "Staged MSIX at: $finalMsix"
          "MSIX_PATH=$finalMsix" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Verify self-contained payload
        shell: pwsh
        run: |
          $msixPath = '${{ steps.locate.outputs.MSIX_PATH }}'
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $archive = [System.IO.Compression.ZipFile]::OpenRead($msixPath)
          try {
            $entries = $archive.Entries | ForEach-Object { $_.FullName.ToLowerInvariant() }

            # Self-contained .NET: coreclr.dll must be present in the package
            $hasCoreCLR = ($entries -like '*coreclr.dll*').Count -gt 0
            # Self-contained Windows App SDK: Microsoft.ui.xaml.dll must be present
            $hasWinUI   = ($entries -like '*microsoft.ui.xaml.dll*').Count -gt 0

            Write-Host "=== SELF-CONTAINED PAYLOAD VERIFICATION ==="
            Write-Host "coreclr.dll present  : $hasCoreCLR  (required: true)"
            Write-Host "microsoft.ui.xaml.dll: $hasWinUI   (required: true)"

            $msixSize = (Get-Item -LiteralPath $msixPath).Length
            $msixSizeMB = [math]::Round($msixSize / 1MB, 2)
            Write-Host "MSIX size: $msixSizeMB MB ($msixSize bytes)"

            if (-not $hasCoreCLR) {
              throw "SELF-CONTAINED VERIFICATION FAILED: coreclr.dll not found in MSIX. The package is still framework-dependent for .NET."
            }
            if (-not $hasWinUI) {
              throw "SELF-CONTAINED VERIFICATION FAILED: microsoft.ui.xaml.dll not found in MSIX. The package still requires an external Windows App SDK runtime."
            }

            Write-Host "VERIFICATION PASSED: MSIX is self-contained for .NET and Windows App SDK."
          } finally {
            $archive.Dispose()
          }

      - name: Sign MSIX with development certificate
        shell: pwsh
        run: |
          $msixPath = '${{ steps.locate.outputs.MSIX_PATH }}'
          $cerPath = Join-Path $env:GITHUB_WORKSPACE 'artifacts\SecureKiosk-Dev.cer'
          & "$env:GITHUB_WORKSPACE\deployment\windows\scripts\sign-msix-dev.ps1" `
            -MsixPath $msixPath `
            -CertificateOutputPath $cerPath

      - name: Trust development certificate and verify signature
        shell: pwsh
        run: |
          $cerPath = Join-Path $env:GITHUB_WORKSPACE 'artifacts\SecureKiosk-Dev.cer'
          $msixPath = '${{ steps.locate.outputs.MSIX_PATH }}'

          & "$env:GITHUB_WORKSPACE\deployment\windows\scripts\trust-dev-certificate.ps1" `
            -CertificatePath $cerPath `
            -MsixPath $msixPath

          & "$env:GITHUB_WORKSPACE\deployment\windows\scripts\verify-msix-signature.ps1" `
            -MsixPath $msixPath `
            -CertificatePath $cerPath

      - name: Verify and report artifact details
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          $msixPath = Join-Path $artifactDir 'SecureKiosk.App_1.0.0.0_x64.msix'
          $cerPath = Join-Path $artifactDir 'SecureKiosk-Dev.cer'

          if (-not (Test-Path -LiteralPath $msixPath -PathType Leaf)) {
            throw "Expected MSIX missing: $msixPath"
          }
          if (-not (Test-Path -LiteralPath $cerPath -PathType Leaf)) {
            throw "Expected CER missing: $cerPath"
          }

          Copy-Item -LiteralPath "$env:GITHUB_WORKSPACE\deployment\windows\scripts\Install.bat" -Destination (Join-Path $artifactDir 'Install.bat') -Force
          Copy-Item -LiteralPath "$env:GITHUB_WORKSPACE\deployment\windows\scripts\Install.ps1" -Destination (Join-Path $artifactDir 'Install.ps1') -Force

          $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($cerPath)
          Write-Host "=== DEVELOPMENT SIGNING VERIFICATION ==="
          Write-Host "Manifest Publisher: CN=SecureKiosk"
          Write-Host "Certificate Subject: $($cert.Subject)"
          Write-Host "Certificate Thumbprint: $($cert.Thumbprint)"
          Write-Host "Certificate Validity: $($cert.NotBefore.ToString('u')) to $($cert.NotAfter.ToString('u'))"
          Write-Host "MSIX Signature Status: VERIFIED"
          Write-Host ""
          Write-Host "=== ARTIFACT FILES ==="
          Get-ChildItem -LiteralPath $artifactDir -File |
            Select-Object Name, @{N='Size (MB)';E={[math]::Round($_.Length/1MB,2)}} |
            Format-Table -AutoSize | Out-String | Write-Host

      - name: Upload SecureKiosk MSIX
        uses: actions/upload-artifact@v4
        with:
          name: SecureKiosk-msix
          path: |
            ${{ github.workspace }}/artifacts/SecureKiosk.App_1.0.0.0_x64.msix
            ${{ github.workspace }}/artifacts/SecureKiosk-Dev.cer
            ${{ github.workspace }}/artifacts/Install.bat
            ${{ github.workspace }}/artifacts/Install.ps1
          if-no-files-found: error
          retention-days: 14
