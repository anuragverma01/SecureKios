name: SecureKiosk Windows MSIX

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    env:
      Solution_Name: SecureKiosk.sln
      App_Project: src\SecureKiosk.App\SecureKiosk.App.csproj
      PublishProfile: Properties\PublishProfiles\win10-x64.pubxml
      Configuration: Release
      Platform: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore SecureKiosk.App for packaging
        shell: pwsh
        run: >-
          msbuild $env:App_Project
          /t:Restore
          /p:Configuration=$env:Configuration
          /p:Platform=$env:Platform
          /p:PublishProfile=$env:PublishProfile
          /p:RuntimeIdentifier=win-x64

      - name: Build and package unsigned MSIX
        shell: pwsh
        run: >-
          msbuild $env:App_Project
          /t:Build
          /p:Configuration=$env:Configuration
          /p:Platform=$env:Platform
          /p:PublishProfile=$env:PublishProfile
          /p:EnableMsixTooling=true
          /p:AppxPackageDir="$env:GITHUB_WORKSPACE\artifacts"
          /p:UapAppxPackageBuildMode=SideloadOnly
          /p:AppxBundle=Never
          /p:AppxPackageSigningEnabled=false
          /p:GenerateAppxPackageOnBuild=true

      - name: Locate unsigned MSIX
        id: locate
        shell: pwsh
        run: |
          $packages = @(
            Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -File -Filter '*.msix' -Recurse -Force -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' }
          )
          if ($packages.Count -eq 0) {
            throw 'MSIX generation failed: no .msix file was found under the workspace.'
          }
          $msixPath = $packages[0].FullName
          Write-Host "Found unsigned MSIX: $msixPath"
          "MSIX_PATH=$msixPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Sign MSIX with development certificate
        shell: pwsh
        run: |
          $msixPath = '${{ steps.locate.outputs.MSIX_PATH }}'
          & "$env:GITHUB_WORKSPACE\deployment\windows\scripts\sign-msix-dev.ps1" `
            -MsixPath $msixPath `
            -CertificateOutputPath "$env:GITHUB_WORKSPACE\artifacts\SecureKiosk-Dev.cer"

      - name: Trust development certificate and verify signature
        shell: pwsh
        run: |
          $cerPath = "$env:GITHUB_WORKSPACE\artifacts\SecureKiosk-Dev.cer"
          $msixPath = '${{ steps.locate.outputs.MSIX_PATH }}'

          # Import the public certificate into TrustedPeople so signtool verify /pa works
          Import-Certificate -FilePath $cerPath -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null

          # Run the existing verification script
          & "$env:GITHUB_WORKSPACE\deployment\windows\scripts\verify-msix-signature.ps1" `
            -MsixPath $msixPath `
            -CertificatePath $cerPath

      - name: Stage signed artifact
        shell: pwsh
        run: |
          $artifactDir = "$env:GITHUB_WORKSPACE\artifacts"
          $msixPath = '${{ steps.locate.outputs.MSIX_PATH }}'
          $cerPath = "$artifactDir\SecureKiosk-Dev.cer"

          # Ensure the signed MSIX is in the artifacts directory
          $targetMsix = Join-Path $artifactDir (Split-Path -Leaf $msixPath)
          if (-not [string]::Equals($msixPath, $targetMsix, [StringComparison]::OrdinalIgnoreCase)) {
            Copy-Item -LiteralPath $msixPath -Destination $targetMsix -Force
          }

          # Verify both files exist
          if (-not (Test-Path -LiteralPath $targetMsix -PathType Leaf)) {
            throw "Signed MSIX not found at: $targetMsix"
          }
          if (-not (Test-Path -LiteralPath $cerPath -PathType Leaf)) {
            throw "Development certificate not found at: $cerPath"
          }

          # Report what the artifact contains
          Write-Host '=== Artifact contents ==='
          Get-ChildItem -LiteralPath $artifactDir -File |
            Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host

          # Report certificate and signature details
          $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($cerPath)
          Write-Host "Manifest Publisher: CN=SecureKiosk"
          Write-Host "Certificate Subject: $($cert.Subject)"
          Write-Host "Certificate Thumbprint: $($cert.Thumbprint)"
          Write-Host "Certificate Validity: $($cert.NotBefore.ToString('u')) to $($cert.NotAfter.ToString('u'))"

          # Remove any non-msix/non-cer files from artifacts
          Get-ChildItem -LiteralPath $artifactDir -File |
            Where-Object { $_.Extension -notin @('.msix', '.cer') } |
            Remove-Item -Force

      - name: Upload SecureKiosk MSIX
        uses: actions/upload-artifact@v4
        with:
          name: SecureKiosk-msix
          path: |
            ${{ github.workspace }}/artifacts/*.msix
            ${{ github.workspace }}/artifacts/*.cer
          if-no-files-found: error
          retention-days: 14
