name: SecureKiosk Windows MSIX

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    env:
      Solution_Name: SecureKiosk.sln
      App_Project: src\SecureKiosk.App\SecureKiosk.App.csproj
      PublishProfile: Properties\PublishProfiles\win10-x64.pubxml
      Configuration: Release
      Platform: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore solution
        shell: pwsh
        run: msbuild $env:Solution_Name /t:Restore /p:Configuration=$env:Configuration

      - name: Build and package unsigned MSIX
        shell: pwsh
        run: >-
          msbuild $env:App_Project
          /t:Build
          /p:Configuration=$env:Configuration
          /p:Platform=$env:Platform
          /p:PublishProfile=$env:PublishProfile
          /p:EnableMsixTooling=true
          /p:AppxPackageDir="$env:GITHUB_WORKSPACE\artifacts"
          /p:UapAppxPackageBuildMode=SideloadOnly
          /p:AppxBundle=Never
          /p:AppxPackageSigningEnabled=false
          /p:GenerateAppxPackageOnBuild=true

      - name: Diagnose MSIX generation and stage artifact
        shell: pwsh
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          $projectRoot = Join-Path $workspace 'src\SecureKiosk.App'
          $projectFile = Join-Path $projectRoot 'SecureKiosk.App.csproj'
          $artifactRoot = Join-Path $workspace 'artifacts'

          Write-Host '--- selected build properties ---'
          Write-Host "MSBuild:"
          msbuild -version
          Write-Host "Configuration=$env:Configuration"
          Write-Host "Platform=$env:Platform"
          Write-Host "PublishProfile=$env:PublishProfile"
          Write-Host "AppxPackageDir=$artifactRoot"

          [xml]$project = Get-Content -LiteralPath $projectFile
          $propertyGroup = $project.Project.PropertyGroup | Select-Object -First 1
          Write-Host "EnableMsixTooling=$($propertyGroup.EnableMsixTooling)"
          Write-Host "ProjectPublishProfile=$($propertyGroup.PublishProfile)"
          if ($propertyGroup.EnableMsixTooling -ne 'true') {
            throw 'MSIX generation failed: EnableMsixTooling is not active in SecureKiosk.App.csproj.'
          }

          Write-Host '--- all generated files under SecureKiosk.App ---'
          Get-ChildItem -LiteralPath $projectRoot -File -Recurse -Force -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName | Write-Host

          Write-Host '--- artifacts, bin, and Packages directories ---'
          $directoryNames = @('artifacts', 'bin', 'Packages')
          $directories = @(
            Get-ChildItem -LiteralPath $workspace -Directory -Recurse -Force -ErrorAction SilentlyContinue |
              Where-Object { $directoryNames -contains $_.Name }
          )
          if ($directories.Count -eq 0) {
            Write-Host 'No artifacts, bin, or Packages directories were found.'
          }
          foreach ($directory in $directories) {
            Write-Host "[$($directory.FullName)]"
            Get-ChildItem -LiteralPath $directory.FullName -Force -Recurse -ErrorAction SilentlyContinue |
              Select-Object FullName, Length, LastWriteTime |
              Format-Table -AutoSize | Out-String | Write-Host
          }

          Write-Host '--- every .msix file under the workspace ---'
          $packages = @(
            Get-ChildItem -LiteralPath $workspace -File -Filter '*.msix' -Recurse -Force -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' }
          )
          if ($packages.Count -eq 0) {
            throw 'MSIX generation failed: MSBuild completed, but no .msix file was found anywhere under the GitHub workspace.'
          }
          $packages | Select-Object -ExpandProperty FullName | Write-Host

          New-Item -ItemType Directory -Path $artifactRoot -Force | Out-Null
          foreach ($package in $packages) {
            $destination = Join-Path $artifactRoot $package.Name
            if (-not [string]::Equals($package.FullName, $destination, [StringComparison]::OrdinalIgnoreCase)) {
              Copy-Item -LiteralPath $package.FullName -Destination $destination -Force
            }
          }

          $stagedPackages = @(
            Get-ChildItem -LiteralPath $artifactRoot -File -Filter '*.msix' -ErrorAction SilentlyContinue
          )
          if ($stagedPackages.Count -eq 0) {
            throw 'MSIX staging failed: a .msix was found, but no package is present in artifacts.'
          }
          Write-Host '--- staged packages for upload ---'
          $stagedPackages | Select-Object -ExpandProperty FullName | Write-Host

      - name: Upload SecureKiosk MSIX
        uses: actions/upload-artifact@v4
        with:
          name: SecureKiosk-unsigned-msix
          path: ${{ github.workspace }}/artifacts/*.msix
          if-no-files-found: error
          retention-days: 14
